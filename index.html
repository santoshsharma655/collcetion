<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Development | Collection</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Poppins', sans-serif; }
@keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, -40px) scale(1.1); } }
@keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes pulseGlow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.5); } }
.animate-float-1 { animation: float 10s infinite alternate ease-in-out; }
.animate-float-2 { animation: float 10s infinite alternate ease-in-out -3s; }
.animate-float-3 { animation: float 10s infinite alternate ease-in-out -5s; }
.animate-spin-slow { animation: rotate 6s infinite linear; }
.animate-pulse-glow { animation: pulseGlow 2s infinite ease-in-out; }
</style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 flex flex-col justify-center items-center relative overflow-x-hidden p-5">
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute w-72 h-72 bg-purple-600/60 rounded-full blur-[80px] top-[10%] left-[15%] animate-float-1"></div>
<div class="absolute w-80 h-80 bg-pink-500/60 rounded-full blur-[80px] bottom-[15%] right-[15%] animate-float-2"></div>
<div class="absolute w-60 h-60 bg-blue-500/60 rounded-full blur-[80px] bottom-[30%] left-[40%] animate-float-3"></div>
</div>
<main id="card" class="relative z-10 bg-white/5 backdrop-blur-xl border border-white/10 p-8 sm:p-10 rounded-3xl text-center max-w-md w-full shadow-2xl transition-transform duration-300 ease-out hover:-translate-y-1">
<div class="w-20 h-20 mx-auto mb-5 bg-gradient-to-br from-pink-500 to-purple-600 rounded-full flex justify-center items-center shadow-lg shadow-pink-500/40">
<i class="fa-solid fa-wand-magic-sparkles text-3xl text-white animate-spin-slow"></i>
</div>
<span class="inline-block px-4 py-1 bg-purple-500/20 border border-purple-500/40 text-purple-300 rounded-full text-xs font-semibold mb-4">Coming Soon</span>
<h1 class="text-2xl font-bold mb-4 bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Under Development & Maintenance</h1>
<p class="text-sm text-slate-400 leading-relaxed mb-6">We're crafting something super cool and amazing for you! This collection space is currently getting an upgrade and will be available very soon. 🚀✨</p>
<div class="flex items-center justify-center gap-2 text-xs text-sky-400 mb-8">
<span class="w-2 h-2 bg-sky-400 rounded-full animate-pulse-glow"></span>
<span>Work in progress...</span>
</div>
<a href="https://santoshsharma1.com.np" class="inline-flex items-center gap-2 px-7 py-3.5 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white font-semibold rounded-full shadow-lg shadow-indigo-500/30 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-indigo-500/50">
<i class="fa-solid fa-house"></i> Go to Main Website
</a>
</main>
<footer class="relative z-10 mt-8 text-xs text-slate-500">
<p>© 2026 Santosh Sharma. All rights reserved.</p>
</footer>
<script>
document.addEventListener('mousemove',(e)=>{const c=document.getElementById('card');if(!c)return;const x=(window.innerWidth/2-e.pageX)/25;const y=(window.innerHeight/2-e.pageY)/25;c.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`;});
document.addEventListener('mouseleave',()=>{const c=document.getElementById('card');if(c)c.style.transform='rotateY(0deg) rotateX(0deg)';});
</script>
</body>
</html>
